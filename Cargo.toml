[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
disco-types = { path = "crates/disco-types" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
sqlite-vec = "0.1.9"
a2a = { package = "a2a-lf", version = "0.4.1" }
a2a-client = { package = "a2a-client-lf", version = "0.2.8" }
a2a-server = { package = "a2a-server-lf", version = "0.5.2" }
agent-client-protocol = { version = "3.3", features = ["stdio"] }
axum = "0.8"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
