name: macos-app
on:
  push:
    paths: ["crates/**", "Cargo.*", ".github/workflows/macos-app.yml"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
        with: { key: universal }
      - run: brew install protobuf
      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: build universal .app + .dmg (ad-hoc signed)
        working-directory: crates/disco-app
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Disco-macOS-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
