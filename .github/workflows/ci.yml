name: ci
on:
  push:
    paths-ignore: ["updates/**", "docs/**", "scripts/**", "*.md"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: DISCO_ENV_PROBE=1 cargo test --workspace --release
      - run: cargo test -p disco-store --release -- --ignored --nocapture
