name: ci
on:
  push:
    paths-ignore: ["updates/**", "docs/**", "scripts/**", "*.md"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: DISCO_ENV_PROBE=1 cargo test --workspace --release
      - run: cargo test -p disco-store --release -- --ignored --nocapture
      # End-to-end: launch the real app with a mock ACP agent and drive every main flow
      # (import, 1:1, groups, multi-person rules, memory switch, undo, rename, stop).
      - run: cargo build -p disco-app -p disco-acp --bins
      - if: runner.os == 'Linux'
        timeout-minutes: 6
        run: HOME=$(mktemp -d) DISCO_SELFTEST=$PWD/target/debug/mock-acp-agent xvfb-run -a target/debug/disco-app
      - if: runner.os == 'macOS'
        timeout-minutes: 6
        run: HOME=$(mktemp -d) DISCO_SELFTEST=$PWD/target/debug/mock-acp-agent target/debug/disco-app
  selftest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: windows-selftest }
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: cargo build -p disco-app -p disco-acp --bins
      - timeout-minutes: 6
        shell: bash
        run: DISCO_SELFTEST="$(cygpath -w "$PWD/target/debug/mock-acp-agent.exe")" target/debug/disco-app.exe
  # UI regression gate: the real crates/disco-app/ui files against a Tauri stub (ui-test/stub.js), in headless
  # Chromium, light + dark, macOS + Windows. Fails on any page error, stray null/undefined text or missing invoke.
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: UI audit
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory . >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/ui-test/index.html >/dev/null && break; sleep 0.2; done
          python ui-test/audit.py --base http://127.0.0.1:8765
