<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Disco</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="rail">
  <div class="drag" data-tauri-drag-region></div>
  <button id="expand" class="tab" type="button" data-ic="sidebar-simple" title="展开列表（⌘\）"></button>
  <button class="tab on" type="button" data-tab="chats" data-ic="chat-circle" title="聊天（⌘1）"></button>
  <button class="tab" type="button" data-tab="groups" data-ic="users-three" title="群聊（⌘2）"></button>
  <button class="tab" type="button" data-tab="agents" data-ic="robot" title="Agent（⌘3）"></button>
  <span class="grow"></span>
  <button class="tab" type="button" data-tab="inbox" data-ic="tray" title="待处理：权限请求和 agent 的提问（⌘4）"><i id="inbox-badge" class="badge"></i></button>
  <button class="tab" type="button" data-tab="settings" data-ic="gear-six" title="设置（⌘,）"></button>
</nav>

<section id="list">
  <header data-tauri-drag-region>
    <label class="search"><span class="sic" data-ic="magnifying-glass"></span><input id="search" placeholder="搜索" autocomplete="off"><kbd id="search-kbd">⌘K</kbd></label>
    <button id="list-add" class="ib" type="button" title="新建"></button>
    <button id="collapse" class="ib" type="button" title="收起列表（⌘\）" data-ic="caret-double-left"></button>
  </header>
  <div id="paused-bar" hidden>已全部停止 <button id="resume" type="button">恢复</button></div>
  <ul id="items"></ul>
</section>

<main id="main">
  <div class="topbar" data-tauri-drag-region></div>
  <div id="pane"></div>
</main>

<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<script src="icons.js"></script>
<script src="logos.js"></script>
<script src="app.js"></script>
</body>
</html>
