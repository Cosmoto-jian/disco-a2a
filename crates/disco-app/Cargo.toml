[package]
name = "disco-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Disco A2A desktop app"

[lib]
name = "disco_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
disco-types.workspace = true
disco-store = { path = "../disco-store" }
disco-a2a = { path = "../disco-a2a" }
disco-discord = { path = "../disco-discord" }
disco-qq = { path = "../disco-qq" }
disco-acp = { path = "../disco-acp" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
a2a.workspace = true
a2a-server.workspace = true
axum.workspace = true
chrono.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
if-addrs = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
keyring = "3"

[lints]
workspace = true
